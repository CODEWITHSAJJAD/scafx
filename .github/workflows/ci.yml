name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install dependencies
        run: pnpm install

      - name: Check code formatting
        run: pnpm run format

      - name: Run linter
        run: pnpm run lint

      - name: Build packages
        run: pnpm -r build

      - name: Run unit & integration tests
        run: pnpm run test:unit

  golden-smoke-matrix:
    name: P0 Smoke Test (${{ matrix.combo.name }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        combo:
          - name: 'Node+Express Standalone'
            test-file: 'packages/templates/src/node-express.smoke.test.ts'
          - name: 'Node+Fastify Standalone'
            test-file: 'packages/templates/src/node-fastify.smoke.test.ts'
          - name: 'Node+NestJS Standalone'
            test-file: 'packages/templates/src/node-nestjs.smoke.test.ts'
          - name: 'Python+FastAPI Standalone'
            test-file: 'packages/templates/src/python-fastapi.smoke.test.ts'
          - name: 'Python+Flask Standalone'
            test-file: 'packages/templates/src/python-flask.smoke.test.ts'
          - name: 'Python+Django Standalone'
            test-file: 'packages/templates/src/python-django.smoke.test.ts'
          - name: '.NET Web API Standalone'
            test-file: 'packages/templates/src/dotnet-webapi.smoke.test.ts'
          - name: 'Flutter Standard Standalone'
            test-file: 'packages/templates/src/flutter-standard.smoke.test.ts'
          - name: 'React+Vite Standalone'
            test-file: 'packages/templates/src/react-vite.smoke.test.ts'
          - name: 'React+Next.js Standalone'
            test-file: 'packages/templates/src/react-nextjs.smoke.test.ts'
          - name: 'React+Vite + FastAPI Full-Stack'
            test-file: 'packages/templates/src/react-fastapi.smoke.test.ts'
          - name: 'Postgres+SQLAlchemy Fragment'
            test-file: 'packages/templates/src/postgres-sqlalchemy.smoke.test.ts'
          - name: 'Node+Prisma Fragment'
            test-file: 'packages/templates/src/node-prisma.smoke.test.ts'
          - name: 'MongoDB Database Fragments'
            test-file: 'packages/templates/src/mongodb-fragments.smoke.test.ts'
          - name: 'Docker & CI Workflow Extras'
            test-file: 'packages/templates/src/docker-ci-extras.smoke.test.ts'
          - name: 'JWT Authentication Boilerplate'
            test-file: 'packages/templates/src/jwt-auth.smoke.test.ts'
          - name: 'Express API Gateway Golden Template'
            test-file: 'packages/templates/src/gateway-express.smoke.test.ts'
          - name: 'Microservices Monorepo Orchestration'
            test-file: 'packages/templates/src/microservices.smoke.test.ts'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false

      - name: Setup Python 3.11
        if: contains(matrix.combo.name, 'Python') || contains(matrix.combo.name, 'FastAPI') || contains(matrix.combo.name, 'Postgres+SQLAlchemy') || contains(matrix.combo.name, 'Microservices')
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup .NET 8.0
        if: matrix.combo.name == '.NET Web API Standalone'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Flutter
        if: matrix.combo.name == 'Flutter Standard Standalone'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm -r build

      - name: Execute ${{ matrix.combo.name }} smoke test
        run: pnpm exec vitest run ${{ matrix.combo.test-file }}
