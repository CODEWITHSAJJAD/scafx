[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "{{projectName}}"
version = "0.1.0"
description = "Django service scaffolded by Universal Project Scaffolder"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "django>=5.0.0",
    "django-cors-headers>=4.3.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
]
